name: ${PROJECT_NAME:-your-persona}

networks:
  default:
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.0.0/16}
  shared:
    external: true
    name: ${SHARED_NETWORK:-your-persona-shared}

services:
  api:
    image: ghcr.io/aprxty3/your_persona_controller:${CONTROLLER_API_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-runtime}
      network: host
    command: ${API_COMMAND:-./api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_API_PORT:-8080}:8080"
    networks:
      default: {}
      shared:
        aliases:
          - ${API_ALIAS:-api}
    env_file:
      - ${ENV_FILE:-../.env}
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    develop:
      watch:
        - action: sync
          path: ..
          target: /app
          ignore:
            - .git/
            - tmp/
            - graphify-out/

  worker:
    image: ghcr.io/aprxty3/your_persona_controller:${CONTROLLER_API_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-runtime}
      network: host
    command: ${WORKER_COMMAND:-./worker}
    restart: unless-stopped
    networks:
      - default
    env_file:
      - ${ENV_FILE:-../.env}
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    healthcheck:
      disable: true # inherits the image's /healthz probe, which the worker does not serve
    develop:
      watch:
        - action: sync
          path: ..
          target: /app
          ignore:
            - .git/
            - tmp/
            - graphify-out/

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in the env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the env file}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in the env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${HOST_DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the env file}"]
    ports:
      - "127.0.0.1:${HOST_REDIS_PORT:-6379}:6379"

  # Edge proxy for the whole VM — ONE Caddy binds :80/:443 and fronts every
  # stack by SNI, so exactly one environment may enable this profile.
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - shared
    depends_on:
      - api

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${HOST_MAILPIT_WEB_PORT:-8025}:8025" # reach via SSH tunnel, never public

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
