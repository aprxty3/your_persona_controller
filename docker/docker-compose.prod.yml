name: your-persona-prod

networks:
  default:
    ipam:
      config:
        - subnet: ${PROD_SUBNET:-172.28.0.0/16}
  shared:
    external: true
    name: ${SHARED_NETWORK_NAME:-your-persona-shared}

services:
  api:
    image: ghcr.io/aprxty3/your_persona_controller:${CONTROLLER_API_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    command: ["./api"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks:
      - default
      - shared
    env_file:
      - ../.env
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      - postgres
      - redis

  worker:
    image: ghcr.io/aprxty3/your_persona_controller:${CONTROLLER_API_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    command: ["./worker"]
    restart: unless-stopped
    networks:
      - default
    env_file:
      - ../.env
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      - postgres
      - redis
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-your_persona_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - shared
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
