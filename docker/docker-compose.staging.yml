name: your-persona-staging

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/16
  shared:
    external: true
    name: your-persona-shared

services:
  api-staging:
    image: ghcr.io/aprxty3/your_persona_controller:${CONTROLLER_API_IMAGE_TAG:-develop}
    command: ["./api"]
    restart: unless-stopped
    networks:
      - default
      - shared
    env_file:
      - ../.env.staging
    environment:
      - DB_HOST=postgres-staging
      - REDIS_HOST=redis-staging
      - SMTP_HOST=mailpit-staging
    depends_on:
      - postgres-staging
      - redis-staging

  worker-staging:
    image: ghcr.io/aprxty3/your_persona_controller:${CONTROLLER_API_IMAGE_TAG:-develop}
    command: ["./worker"]
    restart: unless-stopped
    env_file:
      - ../.env.staging
    environment:
      - DB_HOST=postgres-staging
      - REDIS_HOST=redis-staging
      - SMTP_HOST=mailpit-staging
    depends_on:
      - postgres-staging
      - redis-staging
    healthcheck:
      disable: true

  postgres-staging:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data

  redis-staging:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  mailpit-staging:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8025" # web UI — access via SSH tunnel, not public

volumes:
  postgres_staging_data:
