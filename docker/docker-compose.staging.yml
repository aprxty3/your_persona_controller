name: your-persona-staging

networks:
  # Internal traffic for this stack only (api-staging <-> worker-staging <->
  # postgres-staging/redis-staging). Separate subnet from
  # docker-compose.prod.yml's 172.28.0.0/16 so both stacks can run on the
  # same host without an address clash.
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/16
  # Shared with docker-compose.prod.yml's Caddy — the only container from
  # the prod stack allowed to reach into this stack, and only to reach
  # api-staging (one Caddy handles both domains; only one process can bind
  # host :80/:443). Must exist BEFORE `docker compose up` — compose will not
  # create an external network with a custom subnet for you:
  #   docker network create --subnet=172.30.0.0/16 your-persona-shared
  # TRUSTED_PROXIES in .env.staging must be 172.30.0.0/16 (this shared
  # subnet), NOT the 172.29.0.0/16 default above — Caddy reaches
  # api-staging over the shared network, so that's the subnet its
  # connection actually originates from.
  shared:
    external: true
    name: your-persona-shared

services:
  api-staging:
    image: ghcr.io/aprxty3/your_persona_controller:${CONTROLLER_API_IMAGE_TAG:-develop}
    command: ["./api"]
    restart: unless-stopped
    networks:
      - default
      - shared
    env_file:
      - ../.env.staging
    environment:
      - DB_HOST=postgres-staging
      - REDIS_HOST=redis-staging
      - SMTP_HOST=mailpit-staging
    depends_on:
      - postgres-staging
      - redis-staging

  worker-staging:
    image: ghcr.io/aprxty3/your_persona_controller:${CONTROLLER_API_IMAGE_TAG:-develop}
    command: ["./worker"]
    restart: unless-stopped
    env_file:
      - ../.env.staging
    environment:
      - DB_HOST=postgres-staging
      - REDIS_HOST=redis-staging
      - SMTP_HOST=mailpit-staging
    depends_on:
      - postgres-staging
      - redis-staging
    healthcheck:
      disable: true

  postgres-staging:
    # NOT -alpine — see the same note on docker-compose.prod.yml's postgres
    # service: Alpine lacks the full IANA timezone database this app's
    # hardcoded TimeZone=Asia/Jakarta DSN param needs (MEMORY.md 2026-07-17).
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data

  redis-staging:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  # Catches all outbound mail from staging instead of sending it anywhere
  # real — staging is exercised by automated/manual testing, and nobody
  # wants a test run accidentally emailing a real user's inbox. Swap
  # SMTP_HOST override above to a real provider only if you deliberately
  # want to test the actual delivery path.
  mailpit-staging:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8025" # web UI — access via SSH tunnel, not public

volumes:
  postgres_staging_data:
